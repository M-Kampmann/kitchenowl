services:
  front:
    build:
      context: ./kitchenowl
      dockerfile: Dockerfile.runtime
    restart: unless-stopped
    depends_on:
      - back
  back:
    image: tombursch/kitchenowl-backend:v0.7.10
    restart: unless-stopped
    environment:
      - JWT_SECRET_KEY=PLEASE_CHANGE_ME
      # - KITCHENOWL_MCP_ENABLED=true # Optional: enable MCP endpoint at /mcp
      - FRONT_URL=https://kitchenowl.nexus-agency.net
    volumes:
      - kitchenowl_data:/data

volumes:
  kitchenowl_data:
