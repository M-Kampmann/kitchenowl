services:
  front:
    build: ./kitchenowl
    restart: unless-stopped
    # environment:
    #   - BACK_URL=back:5000 # Change this if you rename the containers
    volumes:
      - /home/matthias/kitchenowl-config/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - back
  back:
    build: ./backend
    restart: unless-stopped
    environment:
      - JWT_SECRET_KEY=PLEASE_CHANGE_ME
      # - KITCHENOWL_MCP_ENABLED=true # Optional: enable MCP endpoint at /mcp
      - FRONT_URL=https://kitchenowl.nexus-agency.net
    volumes:
      - kitchenowl_data:/data

volumes:
  kitchenowl_data:
