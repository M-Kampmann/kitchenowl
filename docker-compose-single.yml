version: "3"
services:
  back:
    build: ./backend
    restart: unless-stopped
    ports:
      - "80:8080"
    environment:
      - JWT_SECRET_KEY=PLEASE_CHANGE_ME
      - FRONT_URL=kitchenowl.nexus-agency.net  # Optional take a look at https://docs.kitchenowl.org/self-hosting/advanced/ for more info
    volumes:
      - kitchenowl_data:/data

volumes:
  kitchenowl_data:
